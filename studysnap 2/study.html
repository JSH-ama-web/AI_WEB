<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>노트 정리하기 · StudySnap</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Study<span>Snap</span></a>
      <button class="menu-toggle" aria-label="메뉴 열기" aria-expanded="false">☰</button>
      <nav class="nav">
        <a href="index.html">홈</a>
        <a href="study.html" class="active">노트 정리하기</a>
        <a href="about.html">사용법 · 소개</a>
        <button class="theme-toggle" aria-label="다크 모드 전환">🌙</button>
      </nav>
    </div>
  </header>

  <main class="container study">
    <h1 class="page-title">노트 정리하기</h1>
    <p class="page-desc">강의 노트 텍스트를 붙여 넣고 버튼을 누르세요. (30자 이상 · 6,000자 이하)</p>

    <form id="study-form" class="panel" novalidate>
      <label for="note" class="label">강의 노트</label>
      <textarea id="note" rows="10" placeholder="예) 연속방정식은 유체의 질량 보존을 나타내며, 비압축성 유체에서는 단면적 × 유속이 일정하다..."></textarea>
      <div class="form-row">
        <span id="char-count" class="hint">0 / 6000자</span>
        <label class="hint">확인 문제
          <select id="quiz-count">
            <option value="2">2개</option>
            <option value="3" selected>3개</option>
            <option value="5">5개</option>
          </select>
        </label>
      </div>
      <div class="form-row">
        <button type="button" id="sample-btn" class="btn btn-ghost">예시 노트 넣기</button>
        <button type="submit" id="submit-btn" class="btn btn-primary">AI로 정리하기</button>
      </div>
    </form>

    <!-- 상태 메시지: 빈 입력 / API 오류 / 지연·타임아웃 안내 -->
    <div id="status" class="status" role="status" aria-live="polite" hidden></div>

    <section id="result" class="result" hidden>
      <div class="panel">
        <h2>📝 요약</h2>
        <p id="summary"></p>
      </div>
      <div class="panel">
        <h2>🔑 핵심 키워드</h2>
        <ul id="keywords" class="keywords"></ul>
      </div>
      <div class="panel">
        <h2>✅ 확인 문제 <small class="hint">(문제를 누르면 정답이 보여요)</small></h2>
        <ol id="quiz" class="quiz"></ol>
      </div>
      <button type="button" id="copy-btn" class="btn btn-ghost">결과 복사하기</button>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 StudySnap · 웹 서비스 과제 프로젝트</div>
  </footer>
  <script src="js/main.js"></script>
  <script src="js/study.js"></script>
</body>
</html>
